<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="chaoxing-bot 学习通自动播放助手">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="210" rx="18" fill="url(#bg)"/>
  <rect width="880" height="210" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="878.5" height="208.5" rx="17.5" fill="none" stroke="#334155" stroke-width="1.5"/>

  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <text x="48" y="46">$ ./run.sh cx_play.py --course "…/studentstudy?courseId=…"</text>
  </g>

  <text x="48" y="112" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="700">chaoxing-bot</text>
  <text x="48" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">学习通 / 超星 · 视频任务点自动播放助手</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect x="48" y="172" width="150" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="62" y="189" fill="#7dd3fc">playback  1.25x</text>
    <rect x="210" y="172" width="132" height="24" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="224" y="189" fill="#c4b5fd">quiz  auto</text>
    <rect x="354" y="172" width="168" height="24" rx="12" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="368" y="189" fill="#f9a8d4">keepalive  on</text>
    <rect x="534" y="172" width="170" height="24" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="548" y="189" fill="#6ee7b7">auto-next  on</text>
  </g>

  <rect x="48" y="96" width="0" height="0" fill="url(#line)"/>
  <rect x="0" y="206" width="880" height="4" fill="url(#line)"/>
</svg>
